<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AI Buddy workbench">
  <title>AI Buddy</title>
  <!-- Two collaborating agents (circles) joined by an execution-rights link,
       over a plan board. Original artwork, MIT, drawn on a 64x64 grid. -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="#12213a"/>
  <!-- plan board rows -->
  <rect x="12" y="40" width="17" height="5" rx="2.5" fill="#3f6ea8"/>
  <rect x="12" y="48" width="11" height="5" rx="2.5" fill="#2d5286"/>
  <!-- execution-rights link -->
  <path d="M26 22h12" stroke="#5ec8a8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="21" cy="22" r="7" fill="#4d8dd6"/>
  <circle cx="43" cy="22" r="7" fill="#8ad7c0"/>
  <circle cx="21" cy="22" r="2.6" fill="#0f1a2c"/>
  <circle cx="43" cy="22" r="2.6" fill="#0f1a2c"/>
  <!-- lock badge -->
  <rect x="36" y="38" width="16" height="13" rx="3" fill="#f0b45a"/>
  <path d="M40 38v-3a4 4 0 0 1 8 0v3" fill="none" stroke="#f0b45a" stroke-width="2.6"/>
</svg>
